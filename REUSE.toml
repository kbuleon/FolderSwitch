# Licensing of the files that cannot carry a header (REUSE specification, https://reuse.software/spec/):
# the icon and the screenshots, the translation files, the project and configuration files.
# A file that has its own SPDX header keeps it ("closest"); every other file falls under this annotation.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Karl BULEON"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Emoji data derived from Unicode files (Unicode Emoji, CLDR): the Unicode License v3, not the GPL. The synonyms
# (src/FolderSwitch.App/Emoji/synonyms.json) are the project's own and stay under the annotation above. The last
# annotation that matches a file wins.
[[annotations]]
path = ["src/FolderSwitch.App/Emoji/catalog.json", "src/FolderSwitch.App/Emoji/keywords/*.json"]
precedence = "closest"
SPDX-FileCopyrightText = "Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

# The cup of Ko-fi's button, cropped from Ko-fi Labs' own brand asset, offered to link to a Ko-fi page; not under the GPL.
[[annotations]]
path = "assets/ko-fi/kofi-cup.png"
precedence = "closest"
SPDX-FileCopyrightText = "Ko-fi Labs Limited"
SPDX-License-Identifier = "LicenseRef-Ko-fi-Brand-Assets"
